<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login | SmartInventory</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color:  #4361EE; /* Vivid blue */
            --secondary-color: #1e272e; /* Deep Charcoal */
            --accent-color: #ffd32a; /* Bright Yellow */
            --light-color: #f9f9fb; /* Soft Background */
            --dark-color: #2d3436; /* Soft Black */
            --success-color: #2ecc71;
            --font-family: 'Poppins', sans-serif; /* Sleek modern font */
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-family);
            scroll-behavior: smooth;
        }
        
        body {
            
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: var(--dark-color);
            overflow-x: hidden;
            min-height: 100vh;
            font-size: 1rem;
        }
        
        /* Navbar */
        .navbar {
            background: rgba(30, 39, 46, 0.9);
            backdrop-filter: blur(10px);
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            position: sticky;
            top: 0;
            z-index: 999;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }
        
        .logo {
            font-size: 2rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            letter-spacing: 1px;
        }
        
        .logo i {
            margin-right: 10px;
            color: var(--primary-color);
        }
        
        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
        }
        
        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .nav-links a::after {
            content: "";
            position: absolute;
            width: 0%;
            height: 2px;
            bottom: -4px;
            left: 0;
            background-color: var(--primary-color);
            transition: width 0.3s ease;
        }
        
        .nav-links a:hover::after {
            width: 100%;
        }
        
        .hamburger {
            display: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: white;
        }
        
        /* Login Container */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 4rem 2rem;
            min-height: calc(100vh - 80px);
        }
        
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            padding: 3rem 2.5rem;
            border-radius: 15px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15);
            max-width: 460px;
            width: 100%;
            animation: slideFadeIn 0.6s ease-out;
            transition: all 0.3s ease;
        }
        
        .login-icon {
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            width: 85px;
            height: 85px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            color: white;
            margin: 0 auto 1.5rem;
            box-shadow: 0 8px 20px rgba(255, 111, 0, 0.3);
        }
        
        .login-card h2 {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--secondary-color);
            margin-bottom: 1rem;
        }
        
        .login-card p {
            color: #666;
            font-size: 1rem;
            margin-bottom: 2rem;
        }
        
        /* Form */
        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }
        
        .form-group label {
            font-weight: 600;
            display: block;
            margin-bottom: 0.5rem;
            color: var(--dark-color);
        }
        
        .form-group input {
            width: 100%;
            padding: 1rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .form-group input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(255, 111, 0, 0.15);
            outline: none;
        }
        
        .password-container {
            position: relative;
        }
        
        .password-toggle {
            position: absolute;
            top: 50%;
            right: 14px;
            transform: translateY(-50%);
            cursor: pointer;
            color: #aaa;
            font-size: 1.1rem;
        }
        
        /* Buttons */
        .login-btn {
            width: 100%;
            padding: 1rem;
            background-color: var(--primary-color);
            color: white;
            font-size: 1.1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s ease, background 0.3s ease;
        }
        
        .login-btn:hover {
            background-color: #e65100;
            transform: translateY(-2px);
        }
        
        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }
        
        .forgot-password a,
        .login-footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }
        
        .remember-me input {
            margin-right: 6px;
        }
        
        .login-footer {
            text-align: center;
            color: #666;
            margin-top: 1rem;
        }
        
        /* Animation */
        @keyframes slideFadeIn {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .hamburger {
                display: block;
            }
        
            .nav-links {
                position: fixed;
                top: 70px;
                left: -100%;
                flex-direction: column;
                width: 100%;
                background-color: var(--secondary-color);
                text-align: center;
                padding: 2rem 0;
                transition: left 0.3s ease;
            }
        
            .nav-links.active {
                left: 0;
            }
        
            .nav-links li {
                margin: 1.5rem 0;
            }
        
            .login-card {
                padding: 2rem;
            }
        }
        
        @media (max-width: 480px) {
            .login-card {
                padding: 1.5rem;
            }
        
            .login-icon {
                width: 70px;
                height: 70px;
                font-size: 1.8rem;
            }
        
            .login-card h2 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">
            <i class="fas fa-box-open"></i>
            <span>SmartInventory</span>
        </div>
        <div class="hamburger">
            <i class="fas fa-bars"></i>
        </div>
        <ul class="nav-links">
            <li><a href="/"><i class="fas fa-home"></i> Home</a></li>
            <li><a href="/user_login"><i class="fas fa-user-tie"></i> Customer</a></li>
            <li><a href="/admin_login"><i class="fas fa-user-shield"></i> Admin</a></li>
        </ul>
    </nav>

    <!-- Login Container -->
    <div class="login-container">
        <div class="login-card">
            <div class="login-icon">
                <i class="fas fa-user-tie"></i>
            </div>
            <h2>User Login</h2>
            <p>Access your inventory management account</p>
            
            <form action="/user_login" method="post">
                <div class="form-group">
                    <label for="user-id">user ID</label>
                    <input type="text" id="user-id" name="email" placeholder="Enter your user ID" required>
                </div>
                
                <div class="form-group">
                    <label for="user-password">Password</label>
                    <div class="password-container">
                        <input type="password" id="user-password" name="password" placeholder="Enter your password" required>
                        <i class="fas fa-eye password-toggle" id="toggleuserPassword"></i>
                    </div>
                </div>
                
                <button type="submit" class="login-btn">Login</button>
                
                <div class="login-footer">
                    <p>Do not have account? <a href="/user_signup">Signup</a></p>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Mobile Menu Toggle
        const hamburger = document.querySelector('.hamburger');
        const navLinks = document.querySelector('.nav-links');
        
        hamburger.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });
        
        // Password Toggle
        const toggleuserPassword = document.querySelector('#toggleuserPassword');
        const userPassword = document.querySelector('#user-password');
        
        toggleuserPassword.addEventListener('click', () => {
            const type = userPassword.getAttribute('type') === 'password' ? 'text' : 'password';
            userPassword.setAttribute('type', type);
            toggleuserPassword.classList.toggle('fa-eye-slash');
        });
        
    </script>
</body>
</html>
