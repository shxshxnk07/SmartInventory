<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login | SmartInventory</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4361EE;      /* Vibrant blue */
            --secondary-color: #1B1F31;    /* Deep Navy */
            --accent-color: #FFDC64;       /* Soft Gold */
            --light-color: #F8F9FA;        /* Light Gray */
            --dark-color: #141821;         /* Dark Charcoal */
            --success-color: #2ECC71;      /* Mint Green */
            --error-color: #FF4E50;        /* Bright Red */
            --neutral-color: #ECEFF4;      /* Off White */
            --glass: rgba(255, 255, 255, 0.15);
            --blur: blur(20px);
            --font-primary: 'Inter', sans-serif;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-primary);
        }
        
        body {
            background: linear-gradient(135deg, var(--neutral-color), #ffffff);
            color: var(--dark-color);
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
        }
        
        /* Navbar */
        .navbar {
            background: var(--glass);
            backdrop-filter: var(--blur);
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
        }
        
        .logo {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .logo i {
            color: var(--primary-color);
        }
        
        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
        }
        
        .nav-links a {
            color: var(--light-color);
            text-decoration: none;
            font-weight: 600;
            position: relative;
            transition: all 0.3s ease;
        }
        
        .nav-links a::after {
            content: "";
            position: absolute;
            height: 2px;
            width: 0;
            bottom: -4px;
            left: 0;
            background: var(--primary-color);
            transition: width 0.3s ease;
        }
        
        .nav-links a:hover::after {
            width: 100%;
        }
        
        .hamburger {
            display: none;
            color: var(--accent-color);
            font-size: 1.8rem;
            cursor: pointer;
        }
        
        /* Login Container */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 70px);
            padding: 2rem;
            background: radial-gradient(circle at top left, #ffffff, var(--neutral-color));
        }
        
        /* Login Card */
        .login-card {
            background: var(--glass);
            backdrop-filter: var(--blur);
            padding: 3rem 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 440px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: fadeInUp 0.6s ease-out;
            text-align: center;
        }
        
        .login-icon {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            border-radius: 50%;
            color: white;
            font-size: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.3);
        }
        
        .login-card h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: var(--secondary-color);
        }
        
        .login-card p {
            color: #666;
            margin-bottom: 2rem;
            font-size: 1rem;
        }
        
        /* Form */
        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }
        
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--dark-color);
        }
        
        .form-group input {
            width: 100%;
            padding: 0.9rem 1rem;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background-color: #fff;
        }
        
        .form-group input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(255, 107, 107, 0.2);
            outline: none;
        }
        
        .password-container {
            position: relative;
        }
        
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #999;
        }
        
        /* Buttons */
        .login-btn {
            width: 100%;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease;
            margin-bottom: 1rem;
        }
        
        .login-btn:hover {
            background: #e85050;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }
        
        .remember-forgot {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }
        
        .remember-me input {
            margin-right: 6px;
        }
        
        .forgot-password a {
            color: var(--primary-color);
            text-decoration: none;
        }
        
        /* Footer */
        .login-footer {
            font-size: 0.9rem;
            color: #777;
        }
        
        .login-footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }
        
        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .hamburger {
                display: block;
            }
        
            .nav-links {
                position: fixed;
                top: 70px;
                left: -100%;
                width: 100%;
                height: calc(100vh - 70px);
                background: var(--secondary-color);
                flex-direction: column;
                align-items: center;
                gap: 1.5rem;
                padding: 2rem 0;
                transition: left 0.3s ease;
            }
        
            .nav-links.active {
                left: 0;
            }
        
            .login-card {
                padding: 2rem;
            }
        }
        
        @media (max-width: 480px) {
            .login-card {
                padding: 1.5rem;
            }
        
            .login-icon {
                width: 70px;
                height: 70px;
                font-size: 2rem;
            }
        
            .login-card h2 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">
            <i class="fas fa-box-open"></i>
            <span>SmartInventory</span>
        </div>
        <div class="hamburger">
            <i class="fas fa-bars"></i>
        </div>
        <ul class="nav-links">
            <li><a href="/"><i class="fas fa-home"></i> Home</a></li>
            <li><a href="/user_login"><i class="fas fa-user-tie"></i> Customer</a></li>
            <li><a href="/admin_login"><i class="fas fa-user-shield"></i> Admin</a></li>
        </ul>
    </nav>

    <!-- Login Container -->
    <div class="login-container">
        <div class="login-card">
            <div class="login-icon">
                <i class="fas fa-user-tie"></i>
            </div>
            <h2>User Signup</h2>
            <p>Create your account to manage inventory easily.</p>
            
            <form action="/user_signup" method="post">
                <div class="form-group">
                    <label for="user-id">user ID</label>
                    <input type="text" id="user-id" name="email" placeholder="Enter your user ID" required>
                </div>
                
                <div class="form-group">
                    <label for="user-password">Password</label>
                    <div class="password-container">
                        <input type="password" id="user-password" name="password" placeholder="Enter your password" required>
                        <i class="fas fa-eye password-toggle" id="toggleuserPassword"></i>
                    </div>
                </div>
                
                <button type="submit" class="login-btn">Login</button>
                
                <div class="login-footer">
                    <p>Already have account? <a href="/user_login">Login</a></p>
                </div>
            </form>
        </div>
    </div>
    
    

    <script>
        // Mobile Menu Toggle
        const hamburger = document.querySelector('.hamburger');
        const navLinks = document.querySelector('.nav-links');
        
        hamburger.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });
        
        // Password Toggle
        const toggleuserPassword = document.querySelector('#toggleuserPassword');
        const userPassword = document.querySelector('#user-password');
        
        toggleuserPassword.addEventListener('click', () => {
            const type = userPassword.getAttribute('type') === 'password' ? 'text' : 'password';
            userPassword.setAttribute('type', type);
            toggleuserPassword.classList.toggle('fa-eye-slash');
        });
        
    </script>
</body>
</html>
