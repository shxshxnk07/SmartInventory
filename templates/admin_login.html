<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | SmartInventory</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Space+Grotesk:wght@400;600&display=swap');

        :root {
            --primary-color: #7f5af0;         /* Soft violet */
            --secondary-color: #16161a;       /* Almost black */
            --accent-color: #ff8906;          /* Sunset orange */
            --light-color: #f5f7fa;           /* Ultra-light gray */
            --dark-color: #1f1f23;            /* Deep dark */
            --success-color: #2cb67d;
            --error-color: #ef4565;
            --warning-color: #faae2b;
            --link-color: #3d9df6;
        
            --glass-bg: rgba(255, 255, 255, 0.06);
            --blur-effect: blur(16px);
            --border-radius: 16px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Space Grotesk', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: var(--light-color);
            font-size: 16px;
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* Navbar */
        .navbar {
            background: var(--dark-color);
            color: white;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            position: sticky;
            top: 0;
            z-index: 999;
        }
        
        .logo {
            font-size: 2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            letter-spacing: -1px;
        }
        
        .logo i {
            margin-right: 10px;
            color: var(--accent-color);
        }
        
        .nav-links {
            display: flex;
            list-style: none;
        }
        
        .nav-links li {
            margin-left: 2rem;
        }
        
        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        
        .nav-links a:hover {
            color: var(--accent-color);
        }
        
        .hamburger {
            display: none;
            font-size: 1.6rem;
            cursor: pointer;
        }
        
        /* Login Container */
        .login-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 3rem;
        }
        
        .login-card {
            background: var(--glass-bg);
            backdrop-filter: var(--blur-effect);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--border-radius);
            padding: 3rem;
            max-width: 460px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.6s ease;
        }
        
        .login-icon {
            background-color: var(--accent-color);
            width: 90px;
            height: 90px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 2.8rem;
            color: #fff;
            box-shadow: 0 8px 20px rgba(255, 137, 6, 0.3);
        }
        
        .login-card h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.4rem;
            color: white;
            margin-bottom: 1rem;
        }
        
        .login-card p {
            color: #d0d0d0;
            margin-bottom: 2rem;
            font-size: 1rem;
        }
        
        /* Form Elements */
        .form-group {
            margin-bottom: 1.8rem;
            text-align: left;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--light-color);
        }
        
        .form-group input {
            width: 100%;
            padding: 0.9rem 1.1rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border-radius: 8px;
            font-size: 1rem;
            transition: border 0.3s, box-shadow 0.3s;
        }
        
        .form-group input:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 4px rgba(127, 90, 240, 0.3);
        }
        
        .password-container {
            position: relative;
        }
        
        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #ccc;
            cursor: pointer;
        }
        
        /* Remember/Forgot */
        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }
        
        .remember-me input {
            margin-right: 10px;
        }
        
        .forgot-password a {
            color: var(--accent-color);
            text-decoration: none;
        }
        
        .login-btn {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .login-btn:hover {
            background-color: #5d3df9;
            box-shadow: 0 10px 20px rgba(127, 90, 240, 0.3);
            transform: translateY(-3px);
        }
        
        /* Footer */
        .login-footer {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #aaa;
        }
        
        .login-footer a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 500;
        }
        
        /* Animation */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .hamburger {
                display: block;
            }
        
            .nav-links {
                position: fixed;
                top: 70px;
                left: -100%;
                width: 100%;
                height: calc(100vh - 70px);
                background: var(--dark-color);
                flex-direction: column;
                align-items: center;
                padding: 2rem 0;
                transition: left 0.3s ease;
            }
        
            .nav-links.active {
                left: 0;
            }
        
            .nav-links li {
                margin: 1.2rem 0;
            }
        
            .login-card {
                padding: 2rem;
            }
        }
        
        @media (max-width: 576px) {
            .login-card {
                padding: 1.5rem;
            }
        
            .login-icon {
                width: 75px;
                height: 75px;
                font-size: 2rem;
            }
        
            .login-card h2 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">
            <!-- <i class="fas fa-boxes"></i> -->
            <span>SmartInventory</span>
        </div>
        <div class="hamburger">
            <i class="fas fa-bars"></i>
        </div>
        <ul class="nav-links">
            <li><a href="/"><i class="fas fa-home"></i> Home</a></li>
            <li><a href="/user_login"><i class="fas fa-user-tie"></i> Customer</a></li>
            <li><a href="/admin_login"><i class="fas fa-user-shield"></i> Admin</a></li>
        </ul>
    </nav>

    <!-- Login Container -->
    <div class="login-container">
        <div class="login-card">
            <div class="login-icon">
                <i class="fas fa-user-shield"></i>
            </div>
            <h2>Admin Login</h2>
            <p>Access the admin dashboard with your credentials</p>
            
            <form action="/admin_login" method="post">
                <div class="form-group">
                    <label for="admin-email">Admin ID</label>
                    <input type="text" id="admin-email" name="email" placeholder="Enter your admin ID" required>
                </div>
                
                <div class="form-group">
                    <label for="admin-password">Password</label>
                    <div class="password-container">
                        <input type="password" id="admin-password" name="password" placeholder="Enter your password" required>
                        <i class="fas fa-eye password-toggle" id="toggleAdminPassword"></i>
                    </div>
                </div>
                
                <button type="submit" class="login-btn">Login</button>
                
                <div class="login-footer">
                    <p>Not an admin? <a href="/user_login">user login here</a></p>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Mobile Menu Toggle
        const hamburger = document.querySelector('.hamburger');
        const navLinks = document.querySelector('.nav-links');
        
        hamburger.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });
        
        // Password Toggle
        const toggleAdminPassword = document.querySelector('#toggleAdminPassword');
        const adminPassword = document.querySelector('#admin-password');
        
        toggleAdminPassword.addEventListener('click', () => {
            const type = adminPassword.getAttribute('type') === 'password' ? 'text' : 'password';
            adminPassword.setAttribute('type', type);
            toggleAdminPassword.classList.toggle('fa-eye-slash');
        });
        
    </script>
</body>
</html>
