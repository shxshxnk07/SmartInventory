<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | NeoStock</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #7B4DFF; /* Vibrant purple */
            --primary-light: #9A7AFF; 
            --secondary: #FF7F6D; /* Coral */
            --accent: #4DEEE7; /* Electric teal */
            --dark: #1E1F2B; /* Deep navy */
            --light: #F9FAFF; /* Soft white */
            --gray: #B4B7C9; /* Cool gray */
            --card-bg: rgba(255, 255, 255, 0.98);
            --shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 12px 36px rgba(0, 0, 0, 0.15);
            --glass: rgba(255, 255, 255, 0.15);
            --font-main: 'Inter', sans-serif;
            --font-heading: 'Sora', sans-serif;
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            --border-radius: 16px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: var(--font-main);
            background-color: var(--light);
            color: var(--dark);
            line-height: 1.7;
            overflow-x: hidden;
        }
        
        h1, h2, h3, h4 {
            font-family: var(--font-heading);
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        
        /* Glassmorphism Navbar */
        .navbar {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 1.2rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            transition: var(--transition);
        }
        
        .navbar.scrolled {
            padding: 0.8rem 3rem;
            background: rgba(255, 255, 255, 0.95);
        }
        
        .logo {
            font-size: 2rem;
            font-weight: 800;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 1rem;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .logo-icon {
            font-size: 2.2rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .nav-links {
            display: flex;
            list-style: none;
            gap: 2.5rem;
        }
        
        .nav-links a {
            color: var(--dark);
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transition: var(--transition);
            position: relative;
            padding: 0.5rem 0;
            font-size: 0.95rem;
        }
        
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            transition: var(--transition);
            border-radius: 3px;
        }
        
        .nav-links a:hover {
            color: var(--primary);
        }
        
        .nav-links a.active::after,
        .nav-links a:hover::after {
            width: 100%;
        }
        
        .nav-links i {
            font-size: 1.2rem;
        }
        
        /* Main Content */
        .container {
            max-width: 1600px;
            margin: 3rem auto;
            padding: 0 3rem;
        }
        
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.6s ease;
        }
        
        .dashboard-header h1 {
            font-size: 2.8rem;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }
        
        .dashboard-header h1 i {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 3rem;
        }
        
        .welcome-message {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            padding: 0.75rem 2rem;
            border-radius: 50px;
            font-weight: 600;
            box-shadow: 0 8px 24px rgba(123, 77, 255, 0.3);
            transition: var(--transition);
        }
        
        .welcome-message:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(123, 77, 255, 0.4);
        }
        
        /* Floating Stats Cards */
        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }
        
        .stat-card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 2rem;
            box-shadow: var(--shadow);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(to bottom, var(--primary), var(--accent));
        }
        
        .stat-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-lg);
        }
        
        .stat-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        
        .stat-card-icon {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: white;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
        }
        
        .stat-card-icon.primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
        }
        
        .stat-card-icon.green {
            background: linear-gradient(135deg, #4ADE80, #22C55E);
        }
        
        .stat-card-icon.orange {
            background: linear-gradient(135deg, #F97316, #EA580C);
        }
        
        .stat-card-icon.red {
            background: linear-gradient(135deg, #EF4444, #DC2626);
        }
        
        .stat-card h3 {
            font-size: 1.1rem;
            color: var(--gray);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.75rem;
        }
        
        .stat-card p {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--dark);
            margin: 0.75rem 0;
            font-family: var(--font-heading);
        }
        
        .stat-card-change {
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
        }
        
        .stat-card-change.positive {
            color: #22C55E;
        }
        
        .stat-card-change.negative {
            color: #EF4444;
        }
        
        /* Floating Action Button */
        .fab {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 10px 30px rgba(123, 77, 255, 0.4);
            cursor: pointer;
            transition: var(--transition);
            z-index: 100;
        }
        
        .fab:hover {
            transform: translateY(-5px) scale(1.1);
            box-shadow: 0 15px 40px rgba(123, 77, 255, 0.5);
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.03);
        }
        
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(var(--primary), var(--accent));
            border-radius: 5px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }
        
        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        
        .floating {
            animation: float 6s ease-in-out infinite;
        }
        
        /* Responsive Styles */
        @media (max-width: 1200px) {
            .container {
                max-width: 100%;
                padding: 0 2rem;
            }
        }
        
        @media (max-width: 992px) {
            .stats-cards {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .dashboard-header h1 {
                font-size: 2.4rem;
            }
        }
        
        @media (max-width: 768px) {
            .navbar {
                padding: 1rem 2rem;
            }
            
            .hamburger {
                display: block;
            }
            
            .nav-links {
                position: fixed;
                top: 90px;
                left: -100%;
                width: 100%;
                background: var(--card-bg);
                flex-direction: column;
                align-items: center;
                padding: 2rem 0;
                gap: 1.5rem;
                transition: var(--transition);
                box-shadow: var(--shadow-lg);
                z-index: 999;
            }
            
            .nav-links.active {
                left: 0;
            }
            
            .stats-cards {
                grid-template-columns: 1fr;
            }
            
            .dashboard-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1.5rem;
            }
            
            .welcome-message {
                width: 100%;
                text-align: center;
            }
        }
        
        @media (max-width: 576px) {
            .container {
                padding: 0 1.5rem;
            }
            
            .dashboard-header h1 {
                font-size: 2rem;
            }
            
            .stat-card {
                padding: 1.5rem;
            }
            
            .stat-card-icon {
                width: 50px;
                height: 50px;
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">
            <i class="fas fa-box-open"></i>
            <span> SmartInventory</span>
        </div>
        <div class="hamburger">
            <i class="fas fa-bars"></i>
        </div>
        <ul class="nav-links">
            <li><a href="/admin_dashboard" class="active"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
            <li><a href="/admin_inventory"><i class="fas fa-box-open"></i> Inventory</a></li>
            <li><a href="/"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <div class="dashboard-header">
            <h1><i class="fas fa-tachometer-alt"></i> Admin Dashboard</h1>
            <div class="welcome-message">Welcome back, <strong>Admin</strong>!</div>
        </div>
        
        <!-- Stats Cards -->
        <div class="stats-cards">
            <div class="stat-card">
                <div class="stat-card-header">
                    <div>
                        <h3>Total Items</h3>
                        <p>{{total_items}}</p>
                    </div>
                    <div class="stat-card-icon primary">
                        <i class="fas fa-boxes"></i>
                    </div>
                </div>
            </div>
            
            <div class="stat-card">
                <div class="stat-card-header">
                    <div>
                        <h3>Total Customers</h3>
                        <p>{{total_users}}</p>
                    </div>
                    <div class="stat-card-icon green">
                        <i class="fas fa-users"></i>
                    </div>
                </div>
            </div>
            
            <div class="stat-card">
                <div class="stat-card-header">
                    <div>
                        <h3>Total Orders</h3>
                        <p>{{total_orders}}</p>
                    </div>
                    <div class="stat-card-icon orange">
                        <i class="fas fa-tasks"></i>
                    </div>
                </div>
            </div>
            
            <div class="stat-card">
                <div class="stat-card-header">
                    <div>
                        <h3>Low Stock Items</h3>
                        <p>{{lowstocs}}</p>
                    </div>
                    <div class="stat-card-icon orange">
                        <i class="fas fa-boxes"></i>
                    </div>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-card-header">
                    <div>
                        <h3>In Stock Items</h3>
                        <p>{{instocs}}</p>
                    </div>
                    <div class="stat-card-icon primary">
                        <i class="fas fa-boxes"></i>
                    </div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-card-header">
                    <div>
                        <h3>Out of Stock</h3>
                        <p>{{outofstocs}}</p>
                    </div>
                    <div class="stat-card-icon red">
                        <i class="fas fa-boxes"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Mobile Menu Toggle
        const hamburger = document.querySelector('.hamburger');
        const navLinks = document.querySelector('.nav-links');
        
        hamburger.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });
    </script>
</body>
</html>
